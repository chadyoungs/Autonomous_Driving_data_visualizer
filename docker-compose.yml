version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vis_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - /mnt/sdb/datasets/nuscenes-data/nuscenes:/data/nuscenes:ro
    environment:
      - NUSCENES_DATA_DIR=/data/nuscenes
      - DEFAULT_DATASET_TYPE=nuscenes
      - NUSCENES_VERSION=v1.0-mini
      - APP_DEBUG=0
    networks:
      - vis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vis_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vis-network

networks:
  vis-network:
